---
name: wc-test
permissions: {}
on:
  workflow_call:
    secrets:
      TAKUMI_GUARD_BOT_ID:
        required: true
jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      id-token: write # Required for OIDC
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache-dependency-path: package-lock.json
          cache: npm
      - uses: flatt-security/setup-takumi-guard-npm@6d4182745c1e474c35a023573c2612c085be45a4 # v1.2.0
        with:
          bot-id: ${{secrets.TAKUMI_GUARD_BOT_ID}}
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      # npm test runs against src, and npm run build only checks that ncc can
      # produce a bundle. Neither runs dist/index.js, which is what workflows
      # actually execute, so a bundle that throws while it is being loaded
      # passes both. Run the action itself to catch that.
      - name: Smoke test the action
        uses: ./
        with:
          action: validate-config
          config: |
            entries:
              - client:
                  repositories:
                    - example/client
                push:
                  branches:
                    - main
