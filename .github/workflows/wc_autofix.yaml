---
name: autofix (workflow_call)
on:
  workflow_call:
    secrets:
      TAKUMI_GUARD_BOT_ID:
        required: true
permissions: {}
jobs:
  # Install npm packages through Takumi Guard, which requires id-token: write.
  # The autofix job runs code of the repository and its dependencies, so it must not have id-token: write.
  npm-prettier:
    uses: suzuki-shunsuke/download-npm-package-action/.github/workflows/download.yaml@cd93d0e45a1804793f6daaf4c24bf55ccf12f494 # v0.0.4
    permissions:
      contents: read
      id-token: write
    with:
      ref: ${{github.event.pull_request.head.sha}}
      working_directory: .github/prettier
      artifact_name: node_modules-prettier
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}

  npm:
    uses: suzuki-shunsuke/download-npm-package-action/.github/workflows/download.yaml@cd93d0e45a1804793f6daaf4c24bf55ccf12f494 # v0.0.4
    permissions:
      contents: read
      id-token: write
    with:
      ref: ${{github.event.pull_request.head.sha}}
      artifact_name: node_modules-autofix
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}

  autofix:
    runs-on: ubuntu-26.04
    needs:
      - npm-prettier
      - npm
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{github.event.pull_request.head.sha}}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - uses: suzuki-shunsuke/download-npm-package-action/restore@v0.0.4
        with:
          artifact_name: node_modules-autofix
      - name: Update JSON Schema
        run: npm run schema
      # Format the generated JSON Schema and fix the code, and push them with autofix.ci
      - uses: suzuki-shunsuke/js-autofix-action@v0.1.0
        with:
          aqua_version: v2.66.1
          checkout: "false"
          npm_artifact_name: node_modules-prettier
